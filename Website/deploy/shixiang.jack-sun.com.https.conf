server {
    listen 80;
    listen [::]:80;
    server_name shixiang.jack-sun.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/shixiang.jack-sun.com;
        default_type text/plain;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shixiang.jack-sun.com;

    root /www/wwwroot/shixiang.jack-sun.com;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/x-icon ico;
        image/svg+xml svg;
        application/manifest+json webmanifest;
        application/xml xml;
        text/plain txt;
    }

    ssl_certificate /etc/letsencrypt/live/shixiang.jack-sun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shixiang.jack-sun.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_buffer_size 4k;

    etag on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location = /robots.txt {
        default_type text/plain;
        expires 1h;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
        try_files $uri =404;
    }

    location = /analytics/collect.php {
        include fastcgi.conf;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/analytics/collect.php;
        fastcgi_read_timeout 10s;
        client_max_body_size 16k;
    }

    location = /analytics/admin-api.php {
        auth_basic "Shixiang Analytics";
        auth_basic_user_file /www/secure/shixiang-analytics.htpasswd;
        include fastcgi.conf;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/analytics/admin-api.php;
        fastcgi_read_timeout 10s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /analytics/admin/ {
        auth_basic "Shixiang Analytics";
        auth_basic_user_file /www/secure/shixiang-analytics.htpasswd;
        try_files $uri $uri/ =404;
        expires -1;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 5m;
    }

    location ~* \.(?:png|jpg|jpeg|webp|css|js|ico|svg|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosn always;
        try_files $uri =404;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /www/wwwlogs/shixiang.jack-sun.com.log;
    error_log /www/wwwlogs/shixiang.jack-sun.com.error.log;
}
