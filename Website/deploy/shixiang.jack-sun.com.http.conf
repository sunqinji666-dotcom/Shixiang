server {
    listen 80;
    listen [::]:80;
    server_name shixiang.jack-sun.com;

    root /www/wwwroot/shixiang.jack-sun.com;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/x-icon ico;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:png|jpg|jpeg|webp|css|js|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /www/wwwlogs/shixiang.jack-sun.com.log;
    error_log /www/wwwlogs/shixiang.jack-sun.com.error.log;
}
